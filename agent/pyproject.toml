[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbusops-agent"
version = "1.0.0rc2"
description = "NimbusOps host agent: telemetry, heartbeat, and approved Docker operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.scripts]
nimbusops-agent = "nimbusops_agent.main:main"

[tool.setuptools]
packages = ["nimbusops_agent"]
